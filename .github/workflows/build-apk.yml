name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App (Vite)
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true

      - name: Install Android SDK Platform 36
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Sync Web Assets to Android Platform
        env:
          CI: "true"
          CAPACITOR_TELEMETRY: "false"
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json 2>/dev/null || true
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Android APK (Release, unsigned)
        env:
          CI: "true"
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign Release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          BT="$ANDROID_HOME/build-tools/36.0.0"
          echo "$KEYSTORE_B64" | base64 -d > /tmp/bloxcraft-release.keystore
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="android/app/build/outputs/apk/release/app-release.apk"
          "$BT/zipalign" -f 4 "$UNSIGNED" /tmp/bloxcraft-aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/bloxcraft-release.keystore \
            --ks-pass:env KEYSTORE_PASSWORD \
            --key-pass:env KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$SIGNED" /tmp/bloxcraft-aligned.apk
          "$BT/apksigner" verify --print-certs "$SIGNED" | head -3
          shred -u /tmp/bloxcraft-release.keystore /tmp/bloxcraft-aligned.apk 2>/dev/null || rm -f /tmp/bloxcraft-release.keystore /tmp/bloxcraft-aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloxCraft-AI-Luau-Studio-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
